name: Build HeyGlass Translate

on:
  push:
    branches:
      - listen-translate
    paths:
      - 'HeyGlassTranslate/**'
      - '.github/workflows/heyglass-translate-build.yml'
  pull_request:
    paths:
      - 'HeyGlassTranslate/**'
      - '.github/workflows/heyglass-translate-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeyGlassTranslate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heyglass-translate-debug
          path: HeyGlassTranslate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
